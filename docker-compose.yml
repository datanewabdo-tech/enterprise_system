services:
  postgres:
    image: postgres:16-alpine
    container_name: enterprise_dashboard_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: enterprise_user
      POSTGRES_PASSWORD: enterprise_secure_password_2026
      POSTGRES_DB: enterprise_dashboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enterprise_user -d enterprise_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enterprise_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: enterprise_dashboard_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://enterprise_user:enterprise_secure_password_2026@postgres:5432/enterprise_dashboard?schema=public
      JWT_SECRET: super_secure_enterprise_jwt_secret_key_2026
      STORAGE_PATH: /app/uploads
    volumes:
      - file_storage:/app/uploads
      - db_backups:/app/backups
    networks:
      - enterprise_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: enterprise_dashboard_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - enterprise_network

volumes:
  postgres_data:
    driver: local
  file_storage:
    driver: local
  db_backups:
    driver: local

networks:
  enterprise_network:
    driver: bridge
